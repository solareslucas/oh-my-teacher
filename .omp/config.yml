# Project-only OMP settings. Provider/model selection remains the user's choice.
skills:
  enabled: true
  enableSkillCommands: true
memory:
  backend: off
autolearn:
  enabled: false
autoResume: false
includeWorkspaceTree: false
tools:
  approvalMode: write
# Read-only hash used to tell a resubmission from an already graded file.
# Allow rules match the whole command; chains and redirections still prompt.
bash:
  patterns:
    - match: "shasum -a 1 *"
      approval: allow
